all", "Informally can introduce the commutative property of addition.", "Relationship between addition and subtraction", "Start with counting on from a visible part and transition to seeing a part as a unit to count on from", "Once we have the number line, refine definitions of addition and subtraction (see definitions)"], "intervention_notes": ["Intervention, Extension, or Optional Activities:", "Think-Shout Counting with a brief finger count (GK M5 TC L18 Differentiation: Support)", "Using a number path allows students to interpret information visually (GK M5 TC L18 UDL: Representation)", "Count On: Drawing (G1 M1 TB L7, Differentiation: Support)", "Encourage students to track with their fingers as they count on (G1 M1 TB L9, Teacher Note)", "Math Catalyst: Count On to Add Within 10", "Count on from a visible part", "Count on from 5 within a set", "Count on to find the total of an addition expression"], "leaves_to_include": ["Problem Types"], "misconceptions": ["Double count the starting number (e.g., for 5 +3, saying “5, 6, 7, 8” but counting 5 as one of the three).", "Students may start counting from 1 instead of a given number, reverting to a “count all” strategy rather than counting on. (Source: Math Catalyst Concept Guide)"], "product_reference": ["GK M1 TE–H", "GK M4–5", "GK M5 L18 (number path image above)", "GK M6", "G1 M1–3", "G2 M1", "Math Catalyst"], "required_skills_cases": ["GK:", "Count on within 5", "Count on within 10", "Use fingers, objects, and number paths", "Results unknown, total known", "G1:", "Count on within 20", "Results and total unknown", "G2:", "apply counting on within larger numbers and more complex comparison contexts"], "specifications": ["GK:", "Count on within 5", "Count on within 10", "Use fingers, objects, and number paths", "Results unknown, total known", "G1:", "Count on within 20", "Change unknown, start unknown, results and total unknown", "G2:", "apply counting on within larger numbers and more complex comparison contexts"] g up four fingers, and says, “Four!” (Source: Doug and Julie)", "Formally introduced in G1 M1 as it marks the shift from counting all to counting on to solve addition and subtraction problems. Students use counting on as a more efficient way to find the total or a missing part. GK M5 Overview (After this Module).", "Numbers in Numbers +/-: Recognizes when a number is part of a whole and can keep the part and whole in mind simultaneously; solves Start Unknown, __ + 4 = 9 problems with counting strategies. (Source: Doug and Julie)", "When asked, “You have some balls, then you get 4 more balls, now, you have 9. How many did you start with?”, counts, putting up fingers: “Five, six, seven, eight, nine.” Looks at fingers, and says, “Five!”", "Likely 2 instructional periods"], "considerations": ["Use part-total diagrams (e.g., “number bonds”) sparingly to keep attention on the number line/path and equations", "Prioritize count-on-from-larger (start counting at the larger addend), a D+J milestone that accelerates the shift away from count-all", "Informally can introduce the commutative property of addition.", "Relationship between addition and subtraction", "Start with counting on from a visible part and transition to seeing a part as a unit to count on from", "For take-from/compare, use count-up-to (a missing-addend strategy) rather than “counting back” as the default", "Comparison problems: m-n is ‘how much bigger’ when m≥n.", "When m<n, m-n is not a whole number; this motivates integers later. Avoid saying you “can’t” take n away from m.", "Once we have the number line, refine definitions of addition and subtraction (see definitions)"], "intervention_notes": ["Intervention, Extension, or Optional Activities:", "To help students record counting up or back, encourage them to use their fingers to track the numbers as they say the count sequence (G2 M1 TD L18, Teacher Note)", "Math Catalyst- Count On to Add Within 10", "Count on from 5 within a set", "Count on from any part in a set"], "leaves_to_include": ["Problem Types"], "misconceptions": ["Double count the starting number (e.g., for 5 +3, saying “5, 6, 7, 8” but counting 5 as one of the three).", "Students may start counting from 1 instead of a given number, reverting to a “count all” strategy rather than counting on. (Source: Math Catalyst Concept Guide)"], "product_reference": ["GK M1 TE–H", "GK M4–5", "GK M5 L18 (number path image above)", "GK M6", "G1 M1–3", "G2 M1", "Math Catalyst"], "required_skills_cases": ["GK:", "Count on to find differences within 5", "Count on to find differences within 10", "Use fingers, objects, and number paths", "G1:", "Count on to find differences with 20", "Change unknown, start unknown", "G2:", "apply counting on to solve subtraction problems, including missing-addened and comparison situations involving larger numbers"], "specifications": ["GK:", "Count on within 5", "Count on within 10", "Use fingers, objects, and number paths", "Results unknown, total known", "G1:", "Count on within 20", "Change unknown, start unknown, results and total unknown", "G2:", "apply counting on within larger numbers and more complex comparison contexts"], "standards_notes": ["K.CC.A.2", "1.OA.C.5", "2.OA.C.4", "CA.K.CC.2", "CA.1.OA.5", "CA.2.OA.4", "FL.K.NSO.3.1", "FL.K.AR.1.3", "FL.1.AR.1.2", "TX.1.3F", "VA.CD3.2e"], "strategies": ["Count on", "cubes à number path à number line"]}}, "ADD:e37c9cfbe10a4bf2": {"source_key": "ADD:e37c9cfbe10a4bf2", "node_id": "ADD-0006", "node_text": "Add by using strategies based on place value concepts and properties of operations. Make ten (G1 M3)", "stem_id": "ADD", "stem_name": "Addition and Subtraction", "cs_label_display": "Add and Subtract whole numbers by applying properties of operations and place value strategies.", "goal": "Legally rearrange and add/subtract using associative and commutative laws of addition\nRewrite to an equivalent, but easier computation\nBridge from strategies using definitions and properties to using algorithms", "grades": ["1", "2"], "state": "span", "in_grade": true, "grade_raw": "G1, G2", "period_hint_text": "Instructional Periods | G1 – likely 10 instructional periods | G2 – likely 10 instructional periods", "ccss": ["1.NBT.C.4", "1.NBT.C.5", "1.OA.B.3", "1.OA.C.6", "1.OA.D.8", "2.NBT.B.6", "2.NBT.B.8", "2.NBT.B.9"], "lessons": [], "state_codes": ["CA.1.NBT.4", "CA.1.NBT.5", "CA.1.OA.3", "CA.1.OA.6", "CA.1.OA.8", "CA.2.NBT.6", "CA.2.NBT.8", "FL.1.AR.1.1", "FL.1.NSO.2.4", "FL.2.NSO.2.2", "FL.2.NSO.2.4", "OK.3.N.2.5", "TX.1.5G", "TX.2.4B", "VA.2.CE.1.h"], "fields": {"additional_notes": ["Fluency Ideas", "See EM2 G1 M2—Whiteboard Exchange: Commutative Property", "See EM2 G1 M3—Whiteboard Exchange: Three Addends", "Additional Notes/Ideas", "Present problems in commuted pairs (6 + 7 and then, immediately after, 7 + 6) (Source: Doug and Julie)", "Relate physical understandings, based on equivalence of groups of objects in various combinations and orders, to the manipulations of them that resulted in this different arrangement, and then to explicit numerical generalizations (Source: Doug and Julie)", "Consider incorporating the student-facing example (use of Unifix cubes and number path) with multiple commuted pairs to help students observe the pattern: each time I switch the order of the cubes (addends), I get the same result. “I keep getting 10!”", "(Source: Danielle S. 😊)", "Instructional Periods", "G1 – likely 10 instructional periods", "G2 – likely 10 instructional periods"], "considerations": ["Use the commutative property of addition to recognize that if I know 2 + 6 = 8, then I also know 6 + 2 = 8", "Use the associative property of addition to add three parts efficiently by grouping addends that make ten (e.g., to find 9 + 7 + 1, I can group the 9 and 1 to make ten)", "Key idea: strategies listed are consequences of the laws and our place value system, not tricks. Use expanded form and associative and commutative laws of addition to justify mental moves (make ten, compensation, etc.) make the connection to the properties explicit for students. Nearly the entire school curriculum rests on these properties. do not lose the forest of the properties for the trees of the particular strategy", "Introduce expanded form here. (Can’t use expanded form until we know what addition means!) Expanded form is a record of place value. We’ll use it later to justify algorithms.", "Always say why it’s legal (associative/commutative, “any order” theorem).", "Connect symbolic notation with number path/line as necessary. Every rewrite must be justified by expanded form and laws", "A put-it-all-together spot before we do the standard algorithms", "Number line usage becomes slightly unwieldy, creating need for other methods", "Use expanded form to connect number line reasoning to written work", "Begin with cases with no regrouping, then include regrouping", "Use relationship between addition and subtraction", "Familiar strategies like make ten can be extended to make a hundred."], "intervention_notes": ["Intervention", "See Math Catalyst: Add Within 20, Objective 1 (Count on from the larger part to find the total.)", "Partners to ten", "See Math Catalyst: Add Within 20, Objectives 2 through 4", "See Math Catalyst: Add Within 100 by Using Mental Strategies, Objectives 1 through 4", "See Math Catalyst: Add Within 100 With and Without Making New Tens, Objective 1"], "leaves_to_include": ["Problem types", "Strategies", "Number of addends", "Number ranges", "Add length measurements"], "mathematical_models": ["Fade counters/fingers → number path → number line → expanded form; avoid decorative pictures; prefer representations that carry the math"], "misconceptions": ["Students think it is more efficient to combine numbers by starting with the least value first and adding it to the greater value, or by adding from left to right when adding two or more addends. (TX BB G1 M2 Overview)", "Students may rely too heavily on counting all or counting on (e.g., I drew 7 dots and 9 dots and counted them all to solve 7 + 9). (TX BB G2 M1 Overview)", "Students see addition and subtraction as unrelated (e.g., “Addition and subtraction are not the same. I can’t", "use addition to subtract”). (TX BB G1 M1 Overview)", "Students add unlike units (e.g., 1 plus 2 equals 3 so 16 + 2 = 36\"). (TX BB G1 M4 Overview)"], "product_reference": ["EM2 G1 M1", "EM2 G1 M1 TC", "EM2 G1 M2", "EM2 G1 M3 TA", "EM2 G1 M3", "EM2 G1 M5 TC", "TX Bluebonnet G1 M1 Topic E", "TX Bluebonnet G1 M2 Topic A", "EM2 G2 M2 TA", "EM2 G2 M2"], "required_skills_cases": ["Sums to 20 (G1)", "Sums to 100 (G1)", "Sums to 200 (G2)", "Sums to 1,000 (G2)", "Include problems that support:", "Counting on from the larger addend:", "Larger addend first", "Larger addend second", "Make Ten:", "Make ten with 3 addends", "Make ten with 2 addends (decompose an addend)", "Make the next ten", "Make a hundred", "Doubles plus one", "Using the relationship between addition and subtraction/related facts", "Adding the ones first and adding the tens first", "Decomposing and adding like units", "Compensation (±1, ±2, ±10) (G2)"], "specifications": ["Observe addends in a different order and understand that the new order does not change the total of an expression.", "Note: Incorporate multiple commuted pairs, Unifix cubes, number path, objects, and counting (see additional notes)", "Recognize that the total for an expression can be found by grouping addends in any order.", "Sums to 20 (G1)", "Sums to 100 (G1)", "Sums to 200 (G2)", "Sums to 1,000 (G2)", "Include problems that support:", "Counting on from the larger addend:", "Larger addend first", "Larger addend second", "Make Ten:", "Make ten with 3 addends", "Make ten with 2 addends (decompose an addend)", "Make the next ten", "Make a hundred", "Doubles plus one", "Using the relationship between addition and subtraction/related facts", "Adding the ones first and adding the tens first", "Decomposing and adding like units", "Compensation (±1, ±2, ±10) (G2)", "Rename 10 of a smaller unit as 1 of a larger unit."], "standards_notes": ["1.OA.B.3", "1.OA.C.6", "1.OA.D.8", "1.NBT.C.4", "1.NBT.C.5", "2.NBT.B.6", "2.NBT.B.8", "2.NBT.B.9", "CA.1.OA.3", "CA.1.OA.6", "CA.1.OA.8", "CA.1.NBT.4", "CA.1.NBT.5", "CA.2.NBT.6", "CA.2.NBT.8", "FL.1.AR.1.1", "FL.1.NSO.2.4", "FL.2.NSO.2.2", "FL.2.NSO.2.4", "TX.1.5G", "TX.2.4B", "OK.3.N.2.5", "VA.2.CE.1.h", "Add and subtract length measurements"], "strategies": ["Associative and commutative laws of addition for whole numbers, additive identity", "Theorem: we can add whole numbers up in any order and get equal sums (this is an extension of the commutative property which is only for 2 addends)", "Make ten", "Example with make ten (note: connect symbolic notation with number path/line to start)", "Compensation (±1, ±2, ±10), break apart and recombine, friendly numbers"], "terminology": ["Commutative Property of Addition: For any numbers (in a given domain) a and b: a+b=b+a", "Associative Property of Addition: For any numbers (in a given domain) a, b, and c: a+(b+c)=(a+b)+c."]}}, "ADD:532ca6f7d865340e": {"source_key": "ADD:532ca6f7d865340e", "node_id": "ADD-0007", "node_text": "Subtract by using strategies based on place value concepts and properties of operations. Take from ten (G1 M3)", "stem_id": "ADD", "stem_name": "Addition and Subtraction", "cs_label_display": "Add and Subtract whole numbers by applying properties of operations and place value strategies.", "goal": "Legally rearrange and add/subtract using associative and commutative laws of addition\nRewrite to an equivalent, but easier computation\nBridge from strategies using definitions and properties to using algorithms", "grades": ["1", "2"], "state": "span", "in_grade": true, "grade_raw": "G1, G2", "period_hint_text": "Instructional Periods | G1 – likely 10 instructional periods | G2 – likely 10 instructional periods", "ccss": ["1.NBT.C.5", "1.NBT.C.6", "1.OA.B.3", "1.OA.C.6", "1.OA.D.8", "2.NBT.B.8", "2.NBT.B.9  *   5. render         pure (state, data) -> HTML string functions
 *   6. controller     holds the page state, delegated events, writes
 *   7. boot

"use strict";

/* ========================================================================
 * 1. esc
 * ===================================================================== */

/* ========================================================================

var GRADE_SHORT = { PK: "PK", K: "K", "1": "G1", "2": "G2", "3": "G3", "4": "G4",

var GRADE_LABELS = { PK: "Pre-K", K: "Kindergarten", "1": "Grade 1", "2": "Grade 2",

  "8": "Grade 8", A1: "Algebra 1" };
var CALIBRATIONS = ["deep", "functional", "illuminating"];
var CAL_LABEL = { deep: "Deep", functional: "Functional", illuminating: "Illuminating" };
var CAL_TEACHER = { deep: "Know it", functional: "Use it", illuminating: "See it" };
var COUNT_TARGET = { deep: 0.25, functional: 0.5, illuminating: 0.25 };
var TIME_TARGET = { deep: 0.4, functional: 0.45, illuminating: 0.15 };
var TIME_MARK_MIN_COVERAGE = 0.5;
var COMPARE_MAX = 4;
var ORDER_STEP = 1024;
var COLLAPSE_CHIP_THRESHOLD = 100;     // Gate B Q1: stems start collapsed above this
var STRUCTURAL_SLICE_CODES = ["bridge", "grade_changed", "before_predecessor", "predecessor_unplaced"];
var DEMO_NOTICE_ORDERING = "Ordering warnings need the server";
var STALE_MESSAGE = "Someone else changed this sequence. Your change was not applied, and you are now seeing the latest.";

var NODE_ROWS = [
  { key: "stem", label: "Stem" }, { key: "concept_skill", label: "Concept/skill" },
  { key: "goal", label: "Goal" }, { key: "grades", label: "Grades" },
  { key: "state", label: "Kind in this grade" }, { key: "grade_raw", label: "Grade (as written)" },
  { key: "period_hint", label: "Period hint" }

/* ========================================================================
 * 3. pure logic
 * ===================================================================== */

/* ---- view state (contract 5.9) ---------------------------------------- */

/** The default ViewState. `slice` is accepted for symmetry (defaults do not depend on it;

function defaultState(slice) {

    context: true, leaves: false, state_ext: true, unplaced_only: false,
    pairings: false, flagged: false, node: null, compare: [], sheet: false };
}

/** All stem ids and cs ids present in a slice (used to drop unknown ids). */
function sliceIds(slice) {

    slice.super_stems.forEach(function (ss) {
      ss.stems.forEach(function (st) {
        stems[st.stem_id] = true;
        st.concept_skills.forEach(function (c) { cs[c.cs_id] = true; });
      });
    });

  return { stems: stems, cs: cs };
}

/** Which stems are collapsed right now: the explicit list, or the default rule. */
function effectiveCollapsed(state, slice) {
  var out = {};
  if (state.collapsed_stems === null || state.collapsed_stems === undefined) {
    if (slice && slice.counts && slice.counts.chips > COLLAPSE_CHIP_THRESHOLD) {
      Object.keys(sliceIds(slice).stems).forEach(function (s) { out[s] = true; });
    }
  } else {
    state.collapsed_stems.forEach(function (s) { out[s] = true; });

function encList(a) { return a.map(encodeURIComponent).join(","); }

/** ViewState -> query string (no leading "?", no "grade"; non-defaults only).

  list("so", state.stem_order);
  if (state.context !== d.context) q.push("ctx=" + (state.context ? 1 : 0));
  if (state.leaves !== d.leaves) q.push("lv=" + (state.leaves ? 1 : 0));
  if (state.state_ext !== d.state_ext) q.push("sx=" + (state.state_ext ? 1 : 0));
  if (state.unplaced_only) q.push("up=1");
  if (state.pairings) q.push("pr=1");

/** "grade=2&..." prefix + encodeState. */

/** Parse a query string into {key: rawValue} WITHOUT percent-decoding values,

function decList(raw) { return raw === "" ? [] : raw.split(",").map(safeDecode).filter(function (x) { return x !== ""; }); }

/** The grade named in a query string, or null. */
function decodeGrade(query) {

/** Query string -> ViewState. Unknown stem / cs ids are dropped silently when

  var ids = slice ? sliceIds(slice) : null;
  function known(list, which) { return ids ? list.filter(function (x) { return ids[which][x]; }) : list; }

  if (has(q, "cl")) s.collapsed_stems = known(decList(q.cl), "stems");
  if (has(q, "so")) s.stem_order = known(decList(q.so), "stems");
  if (has(q, "ctx")) s.context = q.ctx !== "0";
  if (has(q, "lv")) s.leaves = q.lv === "1";
  if (has(q, "sx")) s.state_ext = q.sx !== "0";

function lensOf(state) {

}

  function known(list, which) { return (list || []).filter(function (x) { return ids[which][x]; }); }
  out.hidden_stems = known(lens.hidden_stems, "stems");
  out.hidden_cs = known(lens.hidden_cs, "cs");
  out.collapsed_stems = (lens.collapsed_stems === null || lens.collapsed_stems === undefined) ? null : known(lens.collapsed_stems, "stems");
  out.stem_order = known(lens.stem_order, "stems");

function lensIsDefault(state, slice) {

/* ---- export: the ordered sequence as CSV (pure) ------------------------ */

function csvCell(v) {
  var t = v === null || v === undefined ? "" : String(v);
  if (/^[=+\-@]/.test(t)) t = "'" + t;                       // keep spreadsheets from reading text as a formula
  return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}

/** One row per placement, in module / slot / placement order. */
function sequenceToCsv(view) {
  var rows = [["module", "module_title", "slot", "slot_label", "node_id", "node_text", "stem", "calibration", "teacher_label", "periods", "note", "status"]];
  ((view && view.modules) || []).forEach(function (m) {
    m.slots.forEach(function (s) {
      s.placements.forEach(function (p) {
        rows.push([m.position, m.title, s.position, s.label, p.node_id || p.node_id_seen, p.node_text, p.stem_name,
          p.calibration ? CAL_LABEL[p.calibration] : "", p.calibration ? CAL_TEACHER[p.calibration] : "", p.period_estimate, p.differentiation_note, p.status]);
      });
    });
  });

}

/* ---- small state reducers (return a NEW state; tested in node) --------- */

function toggleCompare(state, key) {
  var s = clone(state), i = s.compare.indexOf(key);
  if (i >= 0) s.compare.splice(i, 1);
  else if (s.compare.length < COMPARE_MAX) s.compare.push(key);
  if (!s.compare.length) s.sheet = false;
  return s;
}

function toggleInList(list, id) {
  var i = list.indexOf(id);
  return i >= 0 ? list.filter(function (x) { return x !== id; }) : list.concat([id]);
}

/** Toggle collapse of a stem; materialises the default rule into an explicit list first. */
function toggleCollapse(state, slice, stemId) {

  if (eff[stemId]) delete eff[stemId]; else eff[stemId] = true;
  s.collapsed_stems = Object.keys(eff);
  return s;
}

/** Stem ids of one super-stem in the order they are displayed. */
function stemIdsInDisplayOrder(slice, state, domain) {
  var out = [];
  visibleSliceAll(slice, state).forEach(function (ss) { if (ss.domain === domain) ss.stems.forEach(function (st) { out.push(st.stem_id); }); });
  return out;
}

/** Move a stem up (-1) or down (+1) within its super-stem by rewriting stem_order. */
function moveStem(state, slice, stemId, dir) {

  slice.super_stems.forEach(function (ss) { ss.stems.forEach(function (st) { if (st.stem_id === stemId) domain = ss.domain; }); });
  if (domain === null) return s;

/* ---- guardrail mirror (contract 5.8, authoritative) --------------------- */

function roundHalfUp(x, dp) { var m = Math.pow(10, dp); return Math.floor(x * m + 0.5) / m; }

/** Counts by level and time by level for a list of {calibration, period_estimate}.
 *  Mirrors mh2/seq_guardrail.compute exactly. No pass/fail anywhere: these are
 *  diagnostics, never quotas. */
function computeGuardrail(placements) {
  var L = CALIBRATIONS, n = placements.length;
  var counts = { deep: 0, functional: 0, illuminating: 0, unset: 0 };
  var sums = { deep: 0, functional: 0, illuminating: 0, unset: 0 };
  var nTimed = 0, allSum = 0;
  placements.forEach(function (p) {
    var k = L.indexOf(p.calibration) >= 0 ? p.calibration : "unset";
    counts[k] += 1;
    if (p.period_estimate !== null && p.period_estimate !== undefined) {
      nTimed += 1; sums[k] += p.period_estimate; allSum += p.period_estimate;
    }
  });
  var nCal = n - counts.unset;
  var T = sums.deep + sums.functional + sums.illuminating;     // raw, unrounded
  var countShare = {}, timeShare = {}, periods = {};
  L.forEach(function (l) {
    countShare[l] = nCal > 0 ? roundHalfUp(counts[l] / nCal, 4) : null;
    timeShare[l] = T > 0 ? roundHalfUp(sums[l] / T, 4) : null;
    periods[l] = roundHalfUp(sums[l], 2);
  });
  periods.unset = roundHalfUp(sums.unset, 2);
  return {
    n: n, n_calibrated: nCal, n_timed: nTimed, counts: counts, count_share: countShare,
    periods: periods, total_periods: roundHalfUp(allSum, 2), time_share: timeShare,
    time_coverage: n > 0 ? roundHalfUp(nTimed / n, 4) : null,
    show_time_targets: n > 0 && (nTimed / n >= TIME_MARK_MIN_COVERAGE),
    count_target: clone(COUNT_TARGET), time_target: clone(TIME_TARGET),
    time_mark_min_coverage: TIME_MARK_MIN_COVERAGE

}

/* ---- compare assembly (contract 5.5, mirrored from assemble_compare) ---- */

function cellIsEmpty(c) { return c === false || (isArray(c) && c.length === 0); }

function assembleCompare(columns, fieldDefs, grade) {
  var C = columns, rows = [];
  function nodeRow(key, label, fn) {
    rows.push({ key: key, label: label, group: "node", kind: "text", cells: C.map(fn), shared: false });
  }
  nodeRow("stem", "Stem", function (c) { return [c.stem_name]; });
  nodeRow("concept_skill", "Concept/skill", function (c) { return [c.cs_label_display]; });
  nodeRow("goal", "Goal", function (c) { return c.goal ? [c.goal] : []; });
  nodeRow("grades", "Grades", function (c) { return c.grades.slice(); });
  nodeRow("state", "Kind in this grade", function (c) { return [c.state]; });
  nodeRow("grade_raw", "Grade (as written)", function (c) { return c.grade_raw ? [c.grade_raw] : []; });
  nodeRow("period_hint", "Period hint", function (c) { return c.period_hint_text ? [c.period_hint_text] : []; });

    var all = [];
    C.forEach(function (c) { getter(c).forEach(function (x) { all.push(x); }); });
    plainSort(uniq(all)).forEach(function (code) {
      var cells = C.map(function (c) { return getter(c).indexOf(code) >= 0; });
      var n = 0; cells.forEach(function (b) { if (b) n += 1; });
      rows.push({ key: prefix + code, label: code, group: group, kind: "flag", cells: cells, shared: n >= 2 });
    });
  }

  flagRows("lesson", "lesson:", function (c) { return c.lessons || []; });

    rows.push({ key: f.key, label: f.label, group: "field", kind: "text", shared: false,
      cells: C.map(function (c) { return (c.fields && has(c.fields, f.key)) ? c.fields[f.key] : []; }) });
  });
  rows.push({ key: "state_codes", label: "State codes", group: "state", kind: "text", shared: false,

  var sc = [], sl = [];
  rows.forEach(function (r) {
    if (r.shared && r.group === "ccss") sc.push(r.label);
    if (r.shared && r.group === "lesson") sl.push(r.label);

/** Display order for compare rows: drop empties and/or float shared rows to the top

function compareRowsView(compare, hideEmpty, sharedFirst) {
  var rows = compare.rows.filter(function (r) { return !(hideEmpty && r.empty); });
  if (sharedFirst) {
    var head = rows.filter(function (r) { return r.group === "node"; });
    var rest = rows.filter(function (r) { return r.group !== "node"; });
    rest = rest.filter(function (r) { return r.shared; }).concat(rest.filter(function (r) { return !r.shared; }));
    rows = head.concat(rest);
  }

/* ---- slice filtering (contract 7.1 visibleSlice) ------------------------- */

  var pos = {}; order.forEach(function (id, i) { pos[id] = i; });
  var listed = stems.filter(function (s) { return has(pos, s.stem_id); }).sort(function (a, b) { return pos[a.stem_id] - pos[b.stem_id]; });

/* ---- period hint text helpers ---------------------------------------- */

/* ---- order-key arithmetic (data model section 4; mirrored by DemoApi) ---- */
