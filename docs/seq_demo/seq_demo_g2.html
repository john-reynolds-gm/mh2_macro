<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MH2 Grade Sequencing</title>
<style>
/* MH2 Grade Sequencing Tool: styles.
 * The :root token block is copied verbatim from scripts/render_static.py (the house look);
 * only the extra tokens at the end of that block are new (contract 7.7).
 * No external fonts, images or URLs: everything is local. */
:root {
  color-scheme: light;
  --bg: #f4f5f7; --panel: #ffffff; --border: #e2e4e9; --border-strong: #cbcfd8;
  --text: #1a1d23; --muted: #6b7080; --muted-2: #8a8f9c;
  --accent: #3457d5; --accent-fg: #ffffff; --accent-soft: #eaeefc; --accent-soft-bd: #c3ccf3;
  --green-bg: #e6f4ea; --green-fg: #1e7a37; --green-bd: #b3ddbf;
  --yellow-bg: #fdf1d6; --yellow-fg: #f5a300; --yellow-bd: #efd694;
  --red-bg: #fbe6e4; --red-fg: #ab2f24; --red-bd: #f0bab2; --red-other-fg: #e2776b;
  --chip-bg: #eef0f3; --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
  --shadow-sm: 0 1px 2px rgba(20, 24, 33, .05);
  --shadow-md: 0 2px 8px rgba(20, 24, 33, .06), 0 1px 2px rgba(20, 24, 33, .04);
  --shadow-lg: 0 8px 24px rgba(20, 24, 33, .08), 0 2px 6px rgba(20, 24, 33, .05);
  /* added for the sequencer (contract 7.7) */
  --teal-bg: #e3f4f4; --teal-fg: #11706f; --teal-bd: #a9dada;
  --violet-bg: #f1edfc; --violet-fg: #5b3fc4; --violet-bd: #d3c8f5;
  --deep: #3457d5; --functional: #1e7a37; --illuminating: #c98a00;
  /* text-safe darker yellow (the house --yellow-fg is for bars and borders, too light for text) */
  --yellow-text: #7a5200;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent-soft-bd); }
[hidden] { display: none !important; }
h1, h2, h3, h4, h5 { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
.grow { flex: 1 1 auto; }
.muted { color: var(--muted); }
.lbl { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: #5a5f6e; margin-right: 4px; }

/* focus ring, as in the audit page */
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,
.slot:focus-visible, .module:focus-visible, [tabindex]:focus-visible {
  outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent);
}

/* ---- page frame ------------------------------------------------------- */
.app { display: flex; flex-direction: column; height: 100vh; min-height: 0; }
.top { background: var(--panel); border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm); z-index: 6; flex: none; }
.hdr { padding: 10px 20px 6px; }
.hdr-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.hdr h1 { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.grade-pick { display: inline-flex; align-items: center; gap: 6px; }
.grade-pick select { min-width: 210px; }
.stamp { color: var(--muted); font-size: 12px; }
.who { font-size: 12.5px; color: var(--muted); }
.who b { color: var(--text); }
.who-name { font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.who-name input { width: 130px; }
.demo-badge { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-soft-bd); border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 650; }
.rail-toggle { display: none; padding: 5px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--panel); }
.rail-toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-soft-bd); color: var(--accent); }
select, input[type=text], input[type=number], textarea {
  padding: 5px 9px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--panel);
}
select.mini { padding: 2px 6px; font-size: 12px; max-width: 190px; }
.banners:empty { display: none; }
.banner { padding: 6px 20px; font-size: 12.5px; border-top: 1px solid var(--border); }
.banner.owner { background: var(--yellow-bg); color: var(--yellow-text); }
.banner.warn { background: var(--chip-bg); color: var(--text); }
.notice-bar:empty { display: none; }
.notice { display: flex; gap: 12px; align-items: center; padding: 8px 20px; font-size: 13px; background: var(--accent-soft); border-bottom: 1px solid var(--accent-soft-bd); }
.notice.warn { background: var(--yellow-bg); border-color: var(--yellow-bd); color: var(--yellow-text); }
.notice.ok { background: var(--green-bg); border-color: var(--green-bd); color: #145a28; }
.notice span { flex: 1 1 auto; }

.toolbar { padding: 6px 20px 10px; }
.tb-row { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
.tb-group { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.tog, .tbtn, .tab2 {
  padding: 4px 11px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel); font-size: 12.5px; user-select: none; white-space: nowrap;
}
.tog:hover, .tbtn:hover:not(:disabled) { border-color: var(--border-strong); }
.tog[aria-pressed="true"], .tab2[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-soft-bd); color: var(--accent); font-weight: 650; }
.tbtn { border-radius: var(--radius-sm); }
.tbtn.sm { padding: 2px 8px; font-size: 12px; }
.tbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.tbtn.primary:hover:not(:disabled) { background: #2b4bc0; }
.tbtn.danger { color: var(--red-fg); border-color: var(--red-bd); }
.tbtn.big { padding: 8px 16px; font-size: 14px; }
.tbtn.add { width: 100%; margin-top: 10px; border-style: dashed; }
.linklike { background: none; border: none; padding: 0 2px; color: var(--accent); font-size: 12px; font-weight: 600; }
.linklike:hover { text-decoration: underline; }
.ibtn { width: 26px; height: 24px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--panel); font-size: 10px; line-height: 1; }
.counts { font-size: 12.5px; color: var(--muted); }
.counts b { color: var(--text); }
.views { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.view-name { width: 160px; }
.confirm-inline { font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; }
.menu-wrap { position: relative; display: inline-block; }
.menu-panel { position: absolute; z-index: 20; top: 100%; left: 0; margin-top: 4px; width: 340px; max-height: 60vh; overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: 8px 10px; }
.menu-dom { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 8px 0 2px; }
.menu-row { display: block; padding: 1px 0; font-size: 13px; }
.menu-cs { font-size: 12px; color: var(--muted); padding-left: 22px; }
.menu-foot { border-top: 1px solid var(--border); margin-top: 8px; padding-top: 6px; }

/* ---- main: rail | slice | drawer ---------------------------------------- */
.main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 380px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.app.drawer-open .main { grid-template-columns: 380px minmax(0, 1fr) 420px; }
/* 1280-1599px with the drawer open: 380 + 420 left ~440px for chips, i.e. ONE 220px chip
   per row. Narrower rail and drawer keep two chips per row (integrator fix). */
@media (min-width: 1280px) and (max-width: 1599px) {
  .app.drawer-open .main { grid-template-columns: 340px minmax(0, 1fr) 380px; }
}
.rail { overflow: auto; background: var(--panel); border-right: 1px solid var(--border); padding: 0 14px 40px; min-height: 0; }
.slice { overflow: auto; padding: 0 20px 60px; min-height: 0; }
.drawer { overflow: auto; background: var(--panel); border-left: 1px solid var(--border); box-shadow: var(--shadow-md); min-height: 0; }
.loading, .empty-slice, .fatal { padding: 40px 10px; text-align: center; color: var(--muted); }

/* ---- slice -------------------------------------------------------------- */
.super-h { position: sticky; top: 0; z-index: 3; margin: 0 -20px; padding: 10px 20px 6px; background: var(--bg); font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); border-bottom: 1px solid var(--border); }
.stem { margin: 14px 0 22px; scroll-margin-top: 44px; }   /* clear the sticky super-stem heading */
.stem-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 0 6px; }
.stem-h h3 { font-size: 15px; font-weight: 650; }
.stem-stat { font-size: 12px; color: var(--muted); }
.stem-collapsed { padding: 10px 14px; border: 1px dashed var(--border-strong); border-radius: var(--radius-md); color: var(--muted); font-size: 13px; background: var(--panel); }
.cs { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 10px 14px 14px; margin-bottom: 10px; }
.cs-h { display: flex; gap: 10px; align-items: flex-start; }
.cs-title { flex: 1 1 auto; font-weight: 600; }
.goal { color: var(--muted); font-size: 12.5px; white-space: pre-line; margin: 2px 0 6px; }
.goal.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.goal.missing { font-style: italic; }
.strip { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 2px; align-items: stretch; }
.strip .arrow { align-self: center; color: var(--muted); padding: 0 3px; font-size: 14px; }
.chip-li { width: 220px; display: flex; }
.chip { width: 100%; min-height: 84px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border-strong); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
.chip-body { flex: 1 1 auto; display: flex; flex-direction: column; gap: 3px; text-align: left; background: none; border: none; padding: 8px 10px 4px; border-radius: var(--radius-md) var(--radius-md) 0 0; }
.chip-body:hover { background: #f7f8fb; }
.c-id { font-size: 11px; color: var(--muted); font-weight: 600; overflow-wrap: anywhere; }
.c-text { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; line-height: 1.4; }
.c-pills, .c-badges { display: flex; flex-wrap: wrap; gap: 3px; }
.gp { display: inline-block; font-size: 10.5px; padding: 0 6px; border-radius: 999px; background: var(--chip-bg); color: #5a5f6e; font-weight: 600; white-space: nowrap; }
.gp.cur { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-soft-bd); }
.c-actions { display: flex; gap: 4px; padding: 3px 8px 6px; border-top: 1px solid var(--border); }
.cbtn { font-size: 11.5px; padding: 1px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--panel); }
.cbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-soft-bd); color: var(--accent); font-weight: 650; }
.chip.ctx { background: rgba(255, 255, 255, .55); border: 1px dashed rgba(160, 166, 180, .85); box-shadow: none; }
.chip.ctx .c-text { color: #3c414d; }
.chip.stateext { border-left: 3px solid var(--violet-bd); }
.chip.leaf { border-style: dotted; border-width: 2px; }
.chip.nograde .c-text { font-style: italic; }
.chip.placed { background: var(--accent-soft); border-color: var(--accent-soft-bd); }
.chip.selected { outline: 2px solid var(--accent); outline-offset: 1px; }

/* badges (a badge always carries its text; colour is never the only signal) */
.b, .pill { display: inline-block; font-size: 10.5px; line-height: 1.5; padding: 0 7px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--chip-bg); color: #40444f; white-space: nowrap; }
.b-kind_pending { border-style: dashed; }
.b-leaf { border-style: dotted; border-width: 2px; }
.b-no_grade { font-style: italic; }
.b-unconfirmed, .b-before_predecessor, .b-grade_changed { background: var(--yellow-bg); border-color: var(--yellow-bd); color: var(--yellow-text); }
.b-state_ext { background: var(--violet-bg); border-color: var(--violet-bd); color: var(--violet-fg); }
.b-shared_code { background: var(--teal-bg); border-color: var(--teal-bd); color: var(--teal-fg); }
.b-bridge { background: var(--panel); border: 2px solid var(--yellow-bd); color: var(--yellow-text); }
.b-orphaned { background: var(--red-bg); border-color: var(--red-bd); color: var(--red-fg); font-weight: 650; }
.b-predecessor_unplaced, .b-relabelled { background: none; border-color: transparent; color: var(--muted); }
.b-placed_elsewhere { background: var(--panel); color: var(--muted); }
.pill.here { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 650; }
.pill.bridge { background: var(--panel); border: 2px solid var(--yellow-bd); color: var(--yellow-text); }

/* ---- rail ------------------------------------------------------------------ */
.rail-empty { padding: 24px 6px; }
.rail-empty h2 { font-size: 15px; margin-bottom: 6px; }
.rail-empty p { color: var(--muted); margin: 0 0 14px; }
.guard { position: sticky; top: 0; z-index: 4; background: var(--panel); margin: 0 -14px 10px; padding: 10px 14px 8px; border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.guard-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.guard-h h2 { font-size: 13px; font-weight: 650; }
.tabs2 { display: inline-flex; gap: 4px; }
.gsub { font-size: 11.5px; color: var(--muted); font-style: italic; margin: 2px 0 6px; }
.gblock { margin-bottom: 8px; }
.glabel { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 3px; }
.gbar { position: relative; height: 12px; border-radius: 999px; background: var(--chip-bg); }
.gbar .segs { display: flex; width: 100%; height: 100%; border-radius: 999px; overflow: hidden; }
.gbar .seg { height: 100%; }
.seg-deep { background: var(--deep); } .seg-functional { background: var(--functional); } .seg-illuminating { background: var(--illuminating); }
.tick { position: absolute; top: -4px; width: 2px; margin-left: -1px; height: 20px; background: var(--text); opacity: .75; }
.glegend { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 4px; font-size: 11.5px; color: var(--text); }
.lg { white-space: nowrap; }
.lg .sw { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; vertical-align: baseline; }
.lg .teach, .lg .ref { color: var(--muted); }
.gcap { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.disc { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: none; padding: 6px 0; font-weight: 650; font-size: 13px; }
.disc::before { content: "\25B8"; font-size: 11px; color: var(--muted); }
.disc[aria-expanded="true"]::before { content: "\25BE"; }
.disc.sm { font-size: 12px; padding: 2px 0; }
.count { background: var(--red-bg); color: var(--red-fg); border: 1px solid var(--red-bd); border-radius: 999px; padding: 0 8px; font-size: 11.5px; }
.attention { border: 1px solid var(--yellow-bd); background: #fffbf0; border-radius: var(--radius-md); padding: 2px 10px 8px; margin-bottom: 12px; }
.att-mod { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 8px 0 4px; }
.att-item { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; margin-bottom: 6px; }
.att-orphaned { border-left: 4px solid var(--red-fg); }
.att-grade_changed { border-left: 4px solid var(--yellow-fg); }
.att-file { font-size: 11px; color: var(--muted); word-break: break-word; }
.att-was { margin: 4px 0; }
.att-sug { border-top: 1px dashed var(--border); padding-top: 6px; margin-top: 6px; }
.att-sug .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 12.5px; }
.att-why, .att-none { font-size: 11.5px; color: var(--muted); margin: 3px 0; }
.att-acts { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.seq-h { padding: 4px 0 6px; }
.seq-h h2 { display: inline; font-size: 15px; margin-right: 6px; }
.seq-meta { font-size: 12px; color: var(--muted); }
.module { border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: #fbfbfc; padding: 8px 8px 10px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
.module.target { border-color: var(--accent); background: #fafbff; }
.mod-h { display: flex; align-items: center; gap: 6px; }
.mod-pos { font-size: 11px; font-weight: 700; background: var(--chip-bg); border-radius: 999px; padding: 0 8px; }
.mod-title { font-size: 14px; font-weight: 650; cursor: text; }
.mod-title-in { flex: 1 1 auto; font-weight: 650; }
.mod-sub { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin: 4px 0 6px; font-size: 12px; }
.target-pick { color: var(--accent); font-weight: 600; }
.mod-sum { color: var(--muted); }
.mod-empty { color: var(--muted); font-size: 12.5px; padding: 8px; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); }
.mod-f { margin-top: 6px; }
.slot { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-top: 6px; padding: 6px 8px; }
.slot.multi { border: 2px solid var(--accent-soft-bd); background: #fdfdff; }
.slot-h { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; }
.slot-pos { font-weight: 650; color: var(--muted); }
.slot-label { font-weight: 500; font-style: italic; }
.slot-label-in { width: 160px; }
.pl { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 6px; scroll-margin-top: 230px; }   /* below the sticky Balance panel */
.prompt { scroll-margin-top: 230px; }
.slot .pl:first-of-type { border-top: none; margin-top: 4px; padding-top: 0; }
.pl.flash { animation: flash 1.6s ease-out 1; }
@keyframes flash { from { background: var(--yellow-bg); } to { background: transparent; } }
.pl-top { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; font-size: 11.5px; }
.pl-id { color: var(--muted); font-weight: 600; overflow-wrap: anywhere; }
.pl-text { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 2px 0 4px; }
.seg-ctl { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; }
.segb { padding: 2px 8px; font-size: 12px; background: var(--panel); border: none; border-right: 1px solid var(--border); }
.segb:last-child { border-right: none; }
.segb[aria-pressed="true"] { color: #fff; font-weight: 650; background: var(--muted); }
.segb.seg-deep[aria-pressed="true"] { background: var(--deep); }
.segb.seg-functional[aria-pressed="true"] { background: var(--functional); }
.segb.seg-illuminating[aria-pressed="true"] { background: #8a5d00; }
.pl-per { display: flex; gap: 6px 8px; align-items: center; flex-wrap: wrap; margin: 5px 0; font-size: 12px; }
.per-lbl input { width: 70px; padding: 2px 6px; margin-left: 4px; }
.hint { color: var(--muted); }
.hint-why { color: var(--muted); font-style: italic; }
.notebtn { background: none; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); padding: 1px 8px; font-size: 12px; color: var(--muted); max-width: 100%; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-edit { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.note-edit textarea { width: 100%; }
.pl-tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; align-items: center; }
.prompt { background: var(--yellow-bg); border: 1px solid var(--yellow-bd); border-radius: var(--radius-md); padding: 10px 12px; margin-bottom: 12px; box-shadow: var(--shadow-md); }
.pr-h { font-weight: 650; margin-bottom: 6px; }
.pr-line { margin: 4px 0; font-size: 13px; }
.pr-note { display: block; font-size: 12.5px; margin: 4px 0 6px; }
.pr-note textarea { display: block; width: 100%; margin-top: 3px; }
.pr-acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.history { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 6px; }
.events { list-style: none; padding: 0; margin: 0 0 6px; font-size: 12px; }
.events li { padding: 2px 0; border-bottom: 1px solid var(--border); }
.when { color: var(--muted); }
.footnote { font-size: 11.5px; color: var(--muted); margin: 14px 0 0; font-style: italic; }

/* ---- drawer ------------------------------------------------------------------ */
.drawer-h { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
.drawer-h h2 { font-size: 15px; }
.drawer-body { padding: 0 0 40px; }
.d-cs { background: var(--accent-soft); border-bottom: 1px solid var(--accent-soft-bd); padding: 10px 14px; }
.d-k { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: #5a5f6e; }
.d-cs-t { font-weight: 650; margin: 2px 0; }
.d-goal { white-space: pre-line; font-size: 13px; }
.d-node, .d-place, .d-else, .d-strip, .d-sec { padding: 10px 14px; border-bottom: 1px solid var(--border); }
.d-id { font-size: 12px; color: var(--muted); font-weight: 650; }
.d-text { font-size: 15px; font-weight: 550; margin: 2px 0 8px; }
.d-kind, .d-grades, .d-line { margin: 4px 0; font-size: 13px; display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.b-kind { background: var(--panel); }
.mini-strip { display: flex; flex-wrap: wrap; gap: 4px 0; align-items: center; margin: 4px 0; }
.mini-strip .arrow { color: var(--muted); padding: 0 3px; }
.mini { font-size: 11px; padding: 1px 7px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--panel); }
.mini.ctx { border-style: dashed; color: #3c414d; }
.mini.self { outline: 2px solid var(--accent); outline-offset: 1px; font-weight: 650; }
.d-nav { display: flex; gap: 6px; }
.d-sec h4 { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
.asc { text-transform: none; letter-spacing: 0; font-weight: 500; font-style: italic; }
.fld h5 { font-size: 12px; font-weight: 650; margin: 8px 0 2px; }
.fld ul { margin: 0; padding-left: 18px; white-space: pre-line; font-size: 13px; }
.fld.empty { opacity: .8; }
.codes { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.code, .linkchip { font-size: 12px; padding: 1px 8px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--chip-bg); }
.code.shared { background: var(--teal-bg); border-color: var(--teal-bd); color: var(--teal-fg); }
.code em { font-style: normal; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
button.linkchip { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-soft-bd); }
.linkchip.plain { color: var(--text); }
.pair { font-size: 13px; margin: 4px 0; }
.nodelink { background: none; border: none; padding: 0 2px; color: var(--accent); font-weight: 600; text-decoration: underline; font-size: inherit; }
.nodelink.plain { color: var(--text); text-decoration: none; font-weight: 500; }
.refs { margin: 0; padding-left: 18px; font-size: 13px; }

/* ---- compare tray and sheet ---------------------------------------------------- */
.tray { flex: none; background: var(--panel); border-top: 1px solid var(--border-strong); box-shadow: 0 -2px 8px rgba(20, 24, 33, .06); padding: 6px 20px; }
.tray-in { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tray-chip { font-size: 12px; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-soft-bd); border-radius: 999px; padding: 0 9px; }
.sheet { flex: none; height: min(var(--sheet-h, 45vh), 80vh); display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid var(--border-strong); box-shadow: 0 -4px 16px rgba(20, 24, 33, .10); }
.sheet-h { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 20px 6px; border-bottom: 1px solid var(--border); position: relative; }
.sheet-grip { position: absolute; left: 50%; top: 2px; width: 56px; height: 5px; margin-left: -28px; border-radius: 999px; background: var(--border-strong); cursor: ns-resize; touch-action: none; }
.sheet-h h2 { font-size: 14px; }
.chk { font-size: 12.5px; color: var(--muted); }
.coplace { font-size: 12.5px; }
.skipnote { font-size: 12px; color: var(--yellow-text); }
.sheet-body { overflow: auto; flex: 1 1 auto; min-height: 0; }
table.cmp { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 13px; }
/* max-width is ignored on table cells, and the table is max-content wide, so a long field value
   would make its column as wide as the whole sentence. Cap the cell CONTENT instead (integrator fix). */
.cmp td > *, .cmp .cmp-col > *, .cmp .corner-in { max-width: 320px; }
.cmp .corner-in { max-width: 170px; }
.cmp th, .cmp td { padding: 6px 10px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); vertical-align: top; text-align: left; min-width: 200px; max-width: 320px; }
.cmp thead th { position: sticky; top: 0; background: #fbfbfc; z-index: 2; font-weight: 500; }
.cmp .corner, .cmp .row-lbl { position: sticky; left: 0; min-width: 150px; max-width: 170px; background: #fbfbfc; z-index: 1; font-weight: 650; font-size: 12px; color: var(--muted); }
.cmp .corner { z-index: 3; font-weight: 500; }
.cmp tr.shared td, .cmp tr.shared th.row-lbl { background: var(--accent-soft); }
.cmp tr[data-group-start] th.row-lbl { border-top: 2px solid var(--border-strong); }
.cmp tr[data-group-start] td { border-top: 2px solid var(--border-strong); }
.tag-shared { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); background: var(--panel); border: 1px solid var(--accent-soft-bd); border-radius: 999px; padding: 0 6px; margin-left: 4px; }
.cmp-id { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.cmp-stem { font-size: 11.5px; color: var(--muted); }
.cmp-text { font-size: 12.5px; margin: 2px 0 4px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cell-line { white-space: pre-line; margin-bottom: 3px; overflow-wrap: anywhere; }
.tick-ok { color: var(--accent); font-weight: 700; }
.codes-inline { display: block; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }

.foot { flex: none; font-size: 11.5px; color: var(--muted); padding: 3px 20px; background: var(--panel); border-top: 1px solid var(--border); }
.foot:empty { display: none; }
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; flex-direction: column; gap: 8px; max-width: min(420px, 92vw); }
.toast { display: flex; gap: 10px; align-items: flex-start; background: var(--text); color: #fff; border-radius: var(--radius-md); padding: 10px 12px; box-shadow: var(--shadow-lg); font-size: 13px; }
.toast span { flex: 1 1 auto; }
.toast .ibtn { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .4); }

/* ---- narrower than 1280px: rail is a toggle, drawer overlays the slice -------------- */
@media (max-width: 1279px) {
  .main, .app.drawer-open .main { grid-template-columns: minmax(0, 1fr); }
  .rail-toggle { display: inline-block; }
  .rail { display: none; }
  .app.rail-open .rail { display: block; position: fixed; z-index: 30; left: 0; top: 0; bottom: 0; width: min(400px, 94vw); box-shadow: var(--shadow-lg); }
  .drawer { position: fixed; z-index: 25; right: 0; top: 0; bottom: 0; width: min(440px, 100vw); }
  .att-sug .cols { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
@media print { .rail, .drawer, .sheet, .tray, .toasts { display: none; } }

. Students can then think about whether the number is greater than or less than 50.", "Incorporate additional benchmarks (25 and 75) to support precision in placement.", "“40 is between 25 and 50. It is only 10 away from 50, but 15 away from 25. 40 should be placed closer to 50 than 25.”", "Estimate the placement of a tick mark on an empty number line labeled with only 0 and 100 (determine the unknown number that belongs at that tick mark—see Rocket Blast on Learning Trajectories website)"]}, {"key": "required_skills_cases", "label": "Required skills / cases", "values": ["Up to 100:", "Orally identify or write the missing number(s) in a sequence", "Given two numbers, identify the one that is greater (orally, by circling, etc.)", "Given two numbers, identify the one that is “closer to” another given number", "“Which is closer to 45, 30 or 50?”", "Place number on empty number line labeled with only 0 and 100, with only 0, 50, and 100, or with only 0, 25, 50, 75, and 100", "Accurately place a number between provided bounds on a number line (place 49 between existing bounds of 40 and 50)", "Ex. From TX BB G1 M4 L11 PS:", "Create interval bounds (i.e., tens) and accurately place a number within the bounds", "Example: Given the number 49, create the bounds of 40 and 50 and place 49 close to 50"]}, {"key": "standards_notes", "label": "Standards notes", "values": ["1.NBT.A.1", "CA.1.NBT.1", "FL.1.NSO.1.4", "FL.2.NSO.1.4", "TX.1.2F", "MD.1.NOS.B.6", "VA.2.NS.2.f"]}, {"key": "considerations", "label": "Considerations", "values": ["“On 0–100, bound 74 between hundreds and tens; which ten is it closer to? Explain with distances.”", "This is probably the earliest we want to define and get all mathy about “estimate”– a thoughtful guess with bounds. About 7 years old per D+J"]}, {"key": "misconceptions", "label": "Misconceptions", "values": ["Students may crowd numbers at the beginning or the end of the number line due to an inability to visualize distance.", "Students may reverse need to count every object one by one.", "The skill should involve both:", "Decomposition: breaking the whole into parts", "Recomposition: combining the approximate parts into a total", "Acceptable reasoning may include additive, skip-counting, or early multiplicative thinking."]}, {"key": "required_skills_cases", "label": "Required skills / cases", "values": ["Equal-size partitioning", "The set can be mentally grouped into approximately equal subsets. Example: “This looks like about 4 groups of 5, so about 20.”", "Unequal-size partitioning", "The set is broken into non-equal but meaningful chunks.", "Example: “There are about 10 on this side and about 6 on that side, so about 16.”", "Array or structured arrangement", "Objects are arranged in rows, columns, clusters, or repeated groups that support partitioning. Example: “About 3 rows of 6, so about 18.”", "Unstructured collection", "Objects are scattered, requiring the student to impose their own grouping strategy.", "Recomposition with approximation", "Student combines estimated subset quantities and understands the result is approximate, not exact."]}, {"key": "standards_notes", "label": "Standards notes", "values": ["2.OA.C.4", "2.OA.C.3", "2.OA.B.2", "CA.2.OA.4", "CA.2.OA.3", "CA.2.NBT.2", "TX.2.6A", "TX.2.2A", "TX.2.4B", "FL.2.AR.3.2", "FL.2.AR.3.1", "FL.2.NSO.1.4"]}, {"key": "considerations", "label": "Considerations", "values": ["How did you group the set? Show a lower estimate, a higher estimate, and defend your best.”", "Possible measurement to include: length, area, volume, time, perimeter, angles", "Variables: Arrays, quasi-arrays, irregular clusters; visibility of grouping cues"]}, {"key": "mathematical_models", "label": "Mathematical models", "values": ["Number line"]}, {"key": "strategies", "label": "Strategies", "values": ["Repeated addition", "Multiplication", "Include measurement along with counting here, and throughout the rest of the stem.", "Choose a unit, iterate, and anchor to measurement benchmarks (about a foot, about a liter).", "Prompts mirror bounds/justification with counting."]}, {"key": "intervention_notes", "label": "Intervention notes", "values": ["Notes for Intervention:", "Encourage students to physically or mentally draw boundaries around subsets.", "The use of ten-frames and 10-frame cartons support one-to-one correspondence (Source: EM2 GK M1 TB L6 & L17)", "Use dot collections, cubes, or counters arranged in loose clusters. Ask questions such as:", "What smaller groups do you notice?", "Which part is easiest to estimate first?", "About how many are in each group?", "Allow students to explain multiple growing strategies for the same collection.", "Progress from structural arrangements (rows, arrays, clusters) to irregular scattered collections.", "Students may choose to use organizing tools as they count and record. Cups, bowls, and number paths can support or challenge students. (Source: EM2 PreK M1 Counting Collections)", "Number paths of different lengths are excellent tools to offer. Number paths support one-to-one correspondence and may allow students to stretch into larger collections than they could count alone. Student also use number paths as a way to independently find and copy numerals. (Source: EM2 GK M1 TG L33)", "Notes for Extension:", "Students who are proficient can deepen their reasoning by:", "Comparing multiple partitioning strategies for the same collection.", "“I saw four groups of six.”", "“I saw two groups of twelve.”", "“I saw ten and about fourteen more.” (EM2 G1 M6 TD L16 Differentiation: Challenge)", "Estimate larger collections (50–200 objects)", "Use benchmark quantities (5, 10, 25, 50, 100)", "Explain which partitioning strategy produces the most reasonable estimate", "Connect partitioning to:", "Repeated addition", "Skip counting", "Arrays", "Area models", "Multiplication", "Estimate before verifying by counting", "Optional Activities:", "Estimating Game (Learning Trajectories website- Composition Estimator E rent forms", "while “expanded form” is about a canonical decomposition of a number according to place value, this row broadens our scope outside of the canonical representation of expanded form and lets us represent numbers in various ways depending on what is more useful for the task at hand."]}, {"key": "misconceptions", "label": "Misconceptions", "values": ["When composing a number, ignoring the place value of each part and just writing the digits (e.g., given 3 tens 14 ones, writing 314 instead of 44)", "Misconceptions from Math Catalyst:", "Students decompose a teen number into 1 and some more ones. For example, students may decompose 16 as 1 and 6.", "When representing numbers, students might not understand how to use the digit 0 to represent 0 of a place value unit. Students might record 6 hundreds 0 tens 4 ones in standard form as 64.", "Students may omit or misplace zeros when writing numbers in standard form because they do not understand the role of placeholder zeros."]}, {"key": "mathematical_models", "label": "Mathematical models", "values": ["Wu’s “counting array”", "Expanded form equations", "Number line"]}, {"key": "intervention_notes", "label": "Intervention notes", "values": ["Intervention: If not used in core lessons, use place value charts, place value cards, and place value disks (use bundles in earlier grades) to compose and decompose numbers", "Optional: use money as a representation to support PV understanding"]}, {"key": "product_reference", "label": "Existing product reference", "values": ["EM2:", "GK M6 L1-L12", "G1 M3 L15 and 16, G1 M5 L2-L5", "G2 M1 L20, L23, L24, L25, L27, L28, L30-L34", "G3 M2 L1 and L4 (place value in the context of metric measurement)", "G4 M1 L5, L7, L8, L10", "Math Catalyst, Place Value:", "Compose, Decompose, and Represent Teen Numbers", "Compose, Decompose, and Represent Numbers to 120", "Compose, Decompose, and Represent Numbers to 1,000", "Compose, Decompose, and Represent Numbers to 100,000", "Compose, Decompo d are consequences of the laws and our place value system, not tricks. Use expanded form and associative and commutative laws of addition to justify mental moves (make ten, compensation, etc.) make the connection to the properties explicit for students. Nearly the entire school curriculum rests on these properties. do not lose the forest of the properties for the trees of the particular strategy", "Introduce expanded form here. (Can’t use expanded form until we know what addition means!) Expanded form is a record of place value. We’ll use it later to justify algorithms.", "Always say why it’s legal (associative/commutative, “any order” theorem).", "Connect symbolic notation with number path/line as necessary. Every rewrite must be justified by expanded form and laws", "A put-it-all-together spot before we do the standard algorithms", "Number line usage becomes slightly unwieldy, creating need for other methods", "Use expanded form to connect number line reasoning to written work", "Begin with cases with no regrouping, then include regrouping", "Use relationship between addition and subtraction", "Familiar strategies like make ten can be extended to make a hundred."]}, {"key": "misconceptions", "label": "Misconceptions", "values": ["Students think it is more efficient to combine numbers by starting with the least value first and adding it to the greater value, or by adding from left to right when adding two or more addends. (TX BB G1 M2 Overview)", "Students may rely too heavily on counting all or counting on (e.g., I drew 7 dots and 9 dots and counted them all to solve 7 + 9). (TX BB G2 M1 Overview)", "Students see addition and subtraction as unrelated (e.g., “Addition and subtraction are not the same. I can’t", "use addition to subtract”). (TX BB G1 M1 Overview)", "Students add unlike units (e.g., 1 plus 2 equals 3 so 16 + 2 = 36\"). (TX BB G1 M4 Overview)"]}, {"key": "mathematical_models", "label": "Mathematical models", "values": ["Fade counters/fingers → number , but don’t let the contexts or visual models become the emphasis", "Formally define division", "(There is overlap with the Expressions and Equations stem here. Relating multiplication and division goes here, finding the unknown in a multiplication or division equation goes there.)", "Want to develop flexibility converting between story situations, a copies of b statements, multiplication equations, division equations, and unit language (e.g., How many twos are in 8?). Can use equal groups, arrays, number line, to visualize and find quotients/missing factors.", "Story situations must be paired with a visual model (context/word problems as motivation, solving word problems is a node in the Expressions and Equations stem)", "Every day language, story language, mathematical language", "What is known, what is unknown?"]}, {"key": "required_skills_cases", "label": "Required skills / cases", "values": ["Up to 10 copies of 10", "Mixture of partitive and measurement situations", "Given a multiplication situation with one factor and the product, represent and explain the related division as missing factor situation.", "Multiplication situations to be represented one of the following representations, (deemphasize equations in this node, they will be emphasized in the Expressions and Equations stem)", "An a copies of b statement", "An equal groups model", "An array", "A number line", "A multiplication equation", "A story situation (must be paired with a visual model, NOT solving word problems here)", "Unit language (e.g., How many twos are in 6?)", "Identify the factors and product in a division situation"]}, {"key": "standards_notes", "label": "Standards notes", "values": ["3.OA.2", "FL.3.AR.2.1", "TX.2.6B (partially)", "TX.3.4J (partially)", "MD.4.NOS.C.7.d"]}, {"key": "considerations", "label": "Considerations", "values": ["This definition of division should be analogous to the definition for subtraction (unknown addend).", "Do not use the word “divide” until we have a definition of it.", "Establish the relationship between multiplication and division", "Include partitive and measurement division (teacher-facing terms only) contexts. Include both partitive and measurement contexts, but keep them as contexts. Division is defined by the multiplication equation.", "Partitive context: 42 objects shared equally into 6 groups asks for q such that 6q=42.", "Measurement context: 42 objects arranged in groups of 6 asks for qsuch that q×6=42.", "By commutativity of multiplication, both lead to the same quotient, but the context meaning differs", "Emphasize over and over and over and over (like a monkey with a miniature cymbal) that for exact division a÷b means that we’re looking for some number q that makes the equation b×q=a true. (before we get to fractions, there very well could be no such number!)"]}, {"key": "misconceptions", "label": "Misconceptions", "values": ["Students think they can write a division equation in any order, instead of starting with the total. (see Math Catalyst, Represent Contextual Division, Concept Guide)"]}, {"key": "mathematical_models", "label": "Mathematical models", "values": ["Equal groups", "Arrays", "Number line", "Equations"]}, {"key": "strategies", "label": "Strategies", "values": ["Level 1 strategy: Make groups and count all", "Level 2 strategy: Make groups and skip count"]}, {"key": "terminology", "label": "Terminology", "values": ["Exact division of whole numbers. For whole numbers a and b, with b>0, a÷b=q means q is the whole number such that a=bq, when such a whole number q exists."]}, {"key": "intervention_notes", "label": "Intervention notes", "values": ["Intervention", "Math Catalyst, Understand Division Concepts, Concept Mini Lessons 1-3, Application", "Extension", "Math Catalyst, Relate Multiplication and Division, Application (not great for the MH2 approach, but would work)"]}, {"key": "product_reference", "label": "Existing product reference", "values": ["EM2 G3 M1 L7, L8, but switch the emphasis  in Chutes and Ladders)...children must read the numerals as they move over them, as in “15, 16, 17!””", "“First graders who estimated the position of target numbers on a 0-100 number line by walking to the estimated position improved in both number line estimation and addition more than those who estimated distances on a screen.”", "“Many competencies help build a mental number line, especially children’s familiarity with numbers in the range considered; for example, their ability to spontaneously subitize or to be a Counter from N.”", "Instructional Period", "2", "Associated Concepts from Other Stems", "Comparing and ordering numbers"], "considerations": ["Place a number on a line 0-10; reason with length, not tick-mark counting", "“Where does __ go on 0–10? Give bounds first, then your best point. Why there?”", "Variables: open/partially labeled line, distractor placements", "Phil says: expect correct order and roughly equal spaced. It’s common for spaces to get smaller as numbers get larger that’s ok... we’re giving them experience to get them equi-spaced. Kids need experience seeing NLs but also DRAWING them. They won’t master it here. That’s ok, they still need to do it"], "intervention_notes": ["Intervention", "Chorally say the number sequence before asking students to identify a missing number.", "Provide a number path or counting cards for students to reference.", "Focus on removing cards with a smaller number (e.g., 2, 3, 4).", "Extension", "Place numbers in a decreasing sequence.", "Determine the relative size and position of numbers to 20 (see EM2 GK M6 L5).", "Remove more than one card and ask students to identify all the missing numbers."], "leaves_to_include": ["Number Range"], "mathematical_models": ["Number line"], "misconceptions": ["Students may not understand that 5 actually contains 1, 2, 3, and 4 inside of it (concept of hierarchical inclusion)", "Issues with number placement when determining relative position (for example, placing the number 5 closer to 0 or to 10 rather than about in the middle)"], "product_reference": ["EM2 PK M3 Topic C", "See Number Stairs—I Can Count and Clothesline Number Path Digital Interactives", "EM2 GK M1 L28 Learn 2 “Number Detective”", "EM2 GK M1 Topic G", "See The First Number Stair and The Last Number Stair Digital Interactives (L29 & L31)", "Dancing Cats Chant", "EM2 GK M3 Topic D L19", "EM2 Florida GK M6 L5 (lesson focuses on teen numbers but could be modified to 10)", "See Clothesline Math Digital Interactive", "EM2 Florida GK M6 L20 (same note as above)"], "required_skills_cases": ["Up to 10 (PK and GK):", "Orally identify or write the missing number(s) in a sequence OR orally identify the missing number stair “step” in a sequence", "Given two numbers, identify the one that is greater (orally, by circling, etc.)", "Given two numbers, identify the one that is “closer to” another given number", "“Which is closer to 6, 9 or 4?”", "Place a number on a number path/line", "Example: When shown a 0 at one end of a line segment and a 10 at the other, a child places a \"5\" approximately in the middle."], "specifications": ["PK and GK:", "Use 1 more, 1 less activities/number stairs to help students build their understanding of number relationships and visualize the size and position of numbers", "1 more/1 less counting (“1, 1 more is 2. 2, 1 more is 3.”)", "Remove/omit numbers or number stair “steps” from a sequence and ask students to determine what’s missing or place missing numbers", "Provide two numbers within 10 and determine which is “biggest” or closer to a given number", "Make a 10 cm ruler", "Incorporate board games beginning in PK (see “additional notes”)", "See Considerations notes around placing numbers on a line"], "standards_notes": ["K.CC.C.7", "K.MD.A.2", "K.CC.B.4", "K.CC.B.4.c", "CA.K.CC.4", "CA.K.CC.4.c", "CA.K.CC.7", "CA.K.MD.2", "TX.K.2H", "FL.K.NSO.2.3", "TX.K.2A"]}}, "EST:78ab44af971dfa39": {"source_key": "EST:78ab44af971dfa39", "node_id": "EST-0004", "node_text": "Determine the relative size and position of numbers up to 100 by using mental number lines and knowledge of number relationships.", "stem_id": "EST", "stem_name": "Estimating", "cs_label_display": "Determine the relative size and position of numbers by using a mental number path or number line.", "goal": "Form a linear representation of numbers", "grades": ["1"], "state": "off_grade", "in_grade": false, "grade_raw": "G1", "period_hint_text": "Instructional Period | 2-3?", "ccss": ["1.NBT.A.1"], "lessons": ["G2-M5-L12", "GK-M6-L19"], "state_codes": ["CA.1.NBT.1", "FL.1.NSO.1.4", "FL.2.NSO.1.4", "MD.1.NOS.B.6", "TX.1.2F", "VA.2.NS.2.f"], "fields": {"additional_notes": ["Additional Notes", "“Visual mediators (rulers and number lists) can help children develop the competence initially.” (Source: Learning Trajectories website)", "“Involve children’s whole bodies: First graders who estimated the position of target numbers on a 0-100 number line by walking to the estimated position improved in both number line estimation and addition more than those who estimated distances on a screen.” (Source: Doug and Julie)", "“Many competencies help build a mental number line, especially children’s familiarity with numbers in the range considered.” (Source: Doug and Julie)", "“It may be that solving arithmetic problems in a given range is another, possibly most effective, way of developing number line estimation.” (Source: Doug and Julie)", "Instructional Period", "2-3?", "Associated Concepts from Other Stems", "Whole Numbers and Base Ten Structure", "Comparing and ordering numbers", "Rounding"], "considerations": ["“On 0–100, bound 74 between hundreds and tens; which ten is it closer to? Explain with distances.”", "This is probably the earliest we want to define and get all mathy about “estimate”– a thoughtful guess with bounds. About 7 years old per D+J"], "intervention_notes": ["Intervention", "Pulled from G2 M5 L12 Differentiation Support box: Support students with identifying the unknown (on a number line) by returning to concrete materials, such as yard sticks and inch tiles.", "Extension", "See Learning Trajectories I’m Thinking of a Number activity"], "leaves_to_include": ["Number range (Example: TX standard is 120)"], "mathematical_models": ["Number line"], "misconceptions": ["Students may crowd numbers at the beginning or the end of the number line due to an inability to visualize distance.", "Students may reverse digits in a number (confusing 23 and 32).", "When labeling benchmarks on a number line between multiples of 10 or 100, students do not identify the correct value halfway between the two multiples. This can lead to an incorrect identification of points on the number line."], "product_reference": ["EM2 GK M6 L19", "TX BB G1 M4 Lesson 11", "EM2 G2 M5 Lesson 12", "Math Catalyst, Place Value, Locate Numbers on a Number Line"], "required_skills_cases": ["Up to 100:", "Orally identify or write the missing number(s) in a sequence", "Given two numbers, identify the one that is greater (orally, by circling, etc.)", "Given two numbers, identify the one that is “closer to” another given number", "“Which is closer to 45, 30 or 50?”", "Place number on empty number line labeled with only 0 and 100, with only 0, 50, and 100, or with only 0, 25, 50, 75, and 100", "Accurately place a number between provided bounds on a number line (place 49 between existing bounds of 40 and 50)", "Ex. From TX BB G1 M4 L11 PS:", "Create interval bounds (i.e., tens) and accurately place a number within the bounds", "Example: Given the number 49, create the bounds of 40 and 50 and place 49 close to 50"], "specifications": ["Provide two numbers within 100 and determine which is “biggest” or closer to a given number", "Examples:", "When child is asked which of two, two-digit numbers is smaller, correctly answers 27.", "When asked, \"Which is closer to 45: 30 or 50?,\" a child says, \" 45 is right next to 50, one five away, but 30 isn't.\"", "Remove/omit numbers from a sequence and ask students to determine what’s missing or place missing numbers", "See Crack the Code on Learning Trajectories website", "Place numbers on a line between interval bounds (i.e., between two tens)", "Move from bounds providedcreate the bounds", "Decide closer to which endpoint by distance", "Place number on an empty number line labeled with only 0 and 100. Add additional tick marks to support precision and help students refine their estimates.", "Divide the number line in half and quarters to create boundaries that support number placement.", "Use the midpoint of 50 as an anchor/benchmark to support placement. Students can then think about whether the number is greater than or less than 50.", "Incorporate additional benchmarks (25 and 75) to support precision in placement.", "“40 is between 25 and 50. It is only 10 away from 50, but 15 away from 25. 40 should be placed closer to 50 than 25.”", "Estimate the placement of a tick mark on an empty number line labeled with only 0 and 100 (determine the unknown number that belongs at that tick mark—see Rocket Blast on Learning Trajectories website)"], "standards_notes": ["1.NBT.A.1", "CA.1.NBT.1", "FL.1.NSO.1.4", "FL.2.NSO.1.4", "TX.1.2F", "MD.1.NOS.B.6", "VA.2.NS.2.f"], "strategies": ["Use tens to create interval bounds", "decide closer to which endpoint by distance"]}}, "EST:1b6fcab79b5f3195": {"source_key": "EST:1b6fcab79b5f3195", "node_id": "EST-0005", "node_text": "Determine the relative size and position of numbers up to 1,000 by using mental number lines and knowledge of number relationships, including place value.", "stem_id": "EST", "stem_name": "Estimating", "cs_label_display": "Determine the relative size and position of numbers by using a mental number path or number line.", "goal": "Form a linear representation of numbers", "grades": ["2"], "state": "core", "in_grade": true, "grade_raw": "G2", "period_hint_text": "Instructional Period | 2-3?", "ccss": [], "lessons": [], "state_codes": ["FL.2.NSO.1.3", "TX.2.2E", "TX.2.2F", "VA.2.NS.1.g"], "fields": {"additional_notes": ["Additional Notes", "“Visual mediators (rulers and number lists) can help children develop the competence initially.” (Source: Learning Trajectories website)", "“Involve children’s whole bodies: First graders who estimated the position of target numbers on a 0-100 number line by walking to the estimated position improved in both number line estimation and addition more than those who estimated distances on a screen.” (Source: Doug and Julie)", "“Many competencies help build a mental number line, especially children’s familiarity with numbers in the range considered.” (Source: Doug and Julie)", "“It may be that solving arithmetic problems in a given range is another, possibly most effective, way of developing number line estimation.” (Source: Doug and Julie)", "Instructional Period", "2-3?", "Associated Concepts from Other Stems", "Whole Numbers and Base Ten Structure", "Comparing and ordering numbers", "Rounding"], "considerations": ["“On 0–1000, bound 374 between hundreds and tens; which hundred is it closer to? Explain with distances.”", "Phil: main thing here is - it works the same with big numbers and little numbers. Go ahead and bring place value up and make the connection explicit – ie put 68 in between 0-100, now do 680 between 0-1000"], "intervention_notes": ["Intervention", "Math Catalyst, Place Value, Locate Numbers on a Number Line", "Extension", "See Learning Trajectories I’m Thinking of a Number activity"], "mathematical_models": ["Number line"], "misconceptions": ["Students may crowd numbers at the beginning or the end of the number line due to an inability to visualize distance.", "When labeling benchmarks on a number line between multiples of 10 or 100, students do not identify the correct value halfway between the two multiples. This can lead to an incorrect identification of points on the number line."], "product_reference": ["Math Catalyst, Place Value, Locate Numbers on a Number Line"], "required_skills_cases": ["Up to 1,000:", "Orally identify or write the missing number(s) in a sequence", "Given two numbers, identify the one that is greater (orally, by circling, etc.)", "Given two numbers, identify the one that is “closer to” another given number", "“Which is closer to 590, 870 or 240?”", "Place number on empty number line labeled with only 0 and 1,000, with only 0, 500, and 1,000, or with only 0, 250, 500, 750, and 1,000", "Accurately place a number between provided bounds on a number line (i.e., tens, hundreds)", "Create interval bounds (i.e., tens, hundreds) and accurately place a number within the bounds", "Example: Given the number 488, create the bounds of 480 and 490 and place 488 close to 490"], "specifications": ["Provide two numbers within 1,000 and determine which is “biggest” or closer to a given number", "(Within 1,000) Remove/omit numbers from a sequence and ask students to determine what’s missing or place missing numbers", "See Chip Flip Century on Learning Trajectories website", "(Within 1,000) Place numbers on a line between interval bounds (i.e., between two tens or hundreds)", "Move from bounds providedcreate the bounds", "Decide closer to which endpoint by distance", "Place number on an empty number line labeled with only 0 and 1,000. Add additional tick marks to support precision and help students refine their estimates.", "Divide the number line in half and quarters to create boundaries that support number placement.", "Use the midpoint of 500 as an anchor/benchmark to support placement. Students can then think about whether the number is greater than or less than 500.", "Incorporate additional benchmarks (250 and 750) to support precision in placement.", "“400 is between 250 and 500. It is only 100 away from 500, but 150 away from 250. 400 should be placed closer to 500 than 250.”", "Estimate the placement of a tick mark on an empty number line labeled with only 0 and 1,000 (determine the unknown number that belongs at that tick mark—see Rocket Blast on Learning Trajectories website", "Use place value to estimate a number’s position. For example, when placing 383 between 350 and 400, compare the digits in the tens place (“8 is greater than 5”) and determine that 383 should be placed after 350, closer to 400."], "standards_notes": ["FL.2.NSO.1.3", "VA.2.NS.1.g", "TX.2.2E", "TX.2.2F"], "strategies": ["Use tens to create interval bounds", "decide closer to which endpoint by distance"]}}, "EST:649a597c1b1fd3a3": {"source_key": "EST:649a597c1b1fd3a3", "node_id": "EST-0007", "node_text": "Estimate the number of objects in a group by using a mental number line.", "stem_id": "EST", "stem_name": "Estimating", "cs_label_display": "Estimate the number of objects in a group by using a mental number line.", "goal": "Make a relatively good guess about a number of objects by using a mental number line (linear representation of numbers)", "grades": ["2"], "state": "core", "in_grade": true, "grade_raw": "G2", "period_hint_text": "Instructional periods: | Likely 1-2 instructional periods", "ccss": ["2.MD.A.3", "2.MD.B.6", "2.NBT.A.2"], "lessons": ["G1-M1-L5", "G2-M1-L11"], "state_codes": ["CA.2.MD.3", "CA.2.MD.6", "CA.2.NBT.2", "CA.2.NBT.7.1", "FL.2.NSO.1.3", "FL.2.NSO.1.4", "TX.2.2D", "TX.2.2E", "TX.2.2F"], "fields": {"additional_notes": ["Related concepts:", "Comparing and ordering numbers", "Comparing measurements", "Launch Ideas:", "EM2 G2 M1 TA L3", "EM2 G2 M1 TD L16", "EM2 G2 M1 TE L20", "Fluency Ideas:", "Counting on a Meter Stick by Tens Within 120 (EM2 G2 M1 TD L15)", "Counting on the Meter Stick by Tens Within 150 (EM2 G2 M1 TD L16)", "Lesson Ideas:", "EM2 G2 M1 TB L10", "EM2 G2 M1 TC L11", "EM2 G2 M1 TD L15 & 16", "EM2 G2 M1 TE L23", "EM2 G2 M4 TA L1", "Instructional periods:", "Likely 1-2 instructional periods"], "considerations": ["Possible measurement to include: length, area, volume, time, perimeter, angles", "We definitely need “estimate” student facing here."], "intervention_notes": ["Notes for Intervention:", "Consider using larger objects (shape tiles or blocks) for children with fine motor delays or a visual impairment (Source: Learning Trajectories: Groupitize!)", "Notes for Extension:", "Justify estimates by explaining which visual features were used (e.g., “It looks close to five groups of ten, so I estimated about 50.”)", "Optional Activities:", "The Estimating Jar [Scanning with Intuitive Quantification] (Source: Learning Trajectories: Comparing and Ordering Number-Scanning with Intuitive Quantification Estimator)"], "mathematical_models": ["Number line"], "misconceptions": ["Estimation means guessing randomly.", "Estimation should be based on visual evidence", "“What number are you comparing to?” “How do you know it is more than 20?”", "(Source: EM2 G2 M1 TC L11-definition for estimates)", "An estimate must be exact.", "Estimates are reasonable approximations.", "Discuss acceptable ranges rather than a single correct answer. (Source: EM2 G2 M1 TC L11-Teacher Note)"], "product_reference": ["G1 M1 TA L5", "G2 M1 TC L11"], "required_skills_cases": ["Size of collection", "Small sets (8–15 objects) (GK)", "Medium sets (20–50 objects) (G1)", "Larger sets (50–200 objects) (G2)", "Arrangement", "Organized arrays", "Scattered arrangements", "Clustered groups", "Mixed-density arrangements", "Number-line relationships", "Locating estimated quantities on a number line", "Comparing two estimates", "Different object types", "Identical objects", "Objects with varying sizes", "Real-world collections (buttons, cubes, counters, dots, leaves, etc.)"], "specifications": ["Observe a collection without counting every object.", "Use visual magnitude and quantities (e.g., 5, 10, 20)", "Identify numbers that are “too low” and “too high.”", "Place the estimated quantity between known values.", "“It looks more than 20 but less than 30.”", "“It is halfway between 40 and 50.”", "Refine estimates when additional information is provided.", "Recognize that estimation produces a reasonable approximation, not an exact count.", "Verify estimates through counting or organizing."], "standards_notes": ["2.NBT.A.2", "2.MD.B.6", "2.MD.A.3", "CA.2.NBT.2", "CA.2.NBT.7.1", "CA.2.MD.6", "CA.2.MD.3", "TX.2.2D", "TX.2.2E", "TX.2.2F", "FL.2.NSO.1.3", "FL.2.NSO.1.4"], "strategies": ["manipulatives, pictures of objects (on paper vs. on screen), dots and other abstract objects"]}}, "EST:ff00e6fbee476ffc": {"source_key": "EST:ff00e6fbee476ffc", "node_id": "EST-0008", "node_text": "Estimate a number of objects or a measurement by using benchmarks.", "stem_id": "EST", "stem_name": "Estimating", "cs_label_display": "Estimate a number of objects or a measurement by using benchmarks.", "goal": "Compare to-be-estimated collection to benchmarks (e.g., 5, 10, 25, 50, 100)", "grades": ["2"], "state": "core", "in_grade": true, "grade_raw": "G2", "period_hint_text": "Instructional Period | 1-2", "ccss": [], "lessons": ["G1-M1-L5", "G2-M1-L11"], "state_codes": ["CA.2.NBT.7.1", "MD.1.NOS.B.6", "MD.2.NOS.A.5"], "fields": {"additional_notes": ["Additional Notes", "“In specifically designed instructional situations (e.g., a whole-group lesson in which a large chart is covered with a number of dots) or other settings (e.g., noting a large flock of birds on the playground), ask children to estimate the number.” (Source: Learning Trajectories website)", "“Asking for a number they know is too high and one that is too low early on establishes boundaries for a reasonable answer and encourages accuracy.” (Source: EM2 G1 M1 L5 Teacher Note)", "Instructional Period", "1-2", "Associated Concepts from Other Stems", "Whole Numbers and Base Ten Structure", "Comparing and ordering numbers", "Rounding", "Comparing measurements"], "considerations": ["Estimate is two things: a thoughtful guess and bounds.", "“Name the benchmark(s) you used. State low/high and your estimate. Why must the true value be in that range?”", "Possible measurement to include: length, area, volume, time, perimeter, angles"], "intervention_notes": ["Intervention", "Focus on smaller groups of objects and benchmarks of 5 and 10", "Extension/Optional", "See Learning Trajectories activity Number Line Estimator [STEMIE]"], "leaves_to_include": ["Time", "Measurement"], "misconceptions": ["Estimation means guessing randomly.", "Estimation should be based on visual evidence", "“What number are you comparing to?” “How do you know it is more than 20?” (Source: EM2 G2 M1 TC L11-definition for estimates)", "An estimate must be exact.", "Estimates are reasonable approximations.", "Discuss acceptable ranges rather than a single correct answer. (Source: EM2 G2 M1 TC L11-Teacher Note)"], "product_reference": ["EM2 G1 M1 TA L5", "EM2 G2 M1 TC L11 (Measurement focus)", "TX BB G2 M2 L5 (Measurement focus)", "TX BB G2 M7 L21 (Measurement focus)"], "required_skills_cases": ["Estimate the total number of objects in a group of up to 100 objects by using either of the following methods:", "Count a subset and use the number as a benchmark", "Example: Shown 45 objects spread out and asked, \"How many?,\" a child responds, \"About 5 tens - Fifty.\"", "Compare the group to known, established benchmarks", "Example: Shown 11 objects, a child says \"it looks like it is between 10 and 20, but closer to 10"], "specifications": ["Using physical objects, help students form benchmarks", "“What would 10 of these look like? 100?”", "Compare a to-be-estimated group to established benchmarks (5, 10, 25, 50, 100)", "Count a small number of the objects and use that group as a benchmark from which an estimate can be made (i.e., by using repeated addition, skip counting, early multiplicative thinking)", "Identify numbers that are “too low” and “too high”", "Verify estimates through counting or organizing", "Incorporate variety in both objects used and their arrangements (arrays, scattered, clustered groups)"], "standards_notes": ["CA.2.NBT.7.1", "MD.1.NOS.B.6", "MD.2.NOS.A.5"], "strategies": ["Count or scan subset to use as benchmark", "Include measurement along with counting here.", "Choose a unit, iterate, and anchor to measurement benchmarks (about a foot, about a liter).", "Prompts mirror bounds/justification with counting."]}}, "EST:1787b11a0d76fb2e": {"source_key": "EST:1787b11a0d76fb2e", "node_id": "EST-0009", "node_text": "Estimate a number of objects by decomposing and recomposing a set.", "stem_id": "EST", "stem_name": "Estimating", "cs_label_display": "Estimate a number of objects by decomposing and recomposing a set.", "goal": "Partition into convenient groups, then recompose", "grades": ["2"], "state": "core", "in_grade": true, "grade_raw": "G2", "period_hint_text": "Instructional days: | Likely 1-2 days instructional days", "ccss": ["2.OA.B.2", "2.OA.C.3", "2.OA.C.4"], "lessons": ["G1-M3-L15", "G2-M1-L23", "G2-M4-L1", "G2-M5-L1", "G2-M6-L2"], "state_codes": ["CA.2.NBT.2", "CA.2.OA.3", "CA.2.OA.4", "FL.2.AR.3.1", "FL.2.AR.3.2", "FL.2.NSO.1.4", "TX.2.2A", "TX.2.4B", "TX.2.6A"], "fields": {"additional_notes": ["Related concepts:", "Addition", "Multiplication and Division", "Fractions", "strong connections to other stems: adding as an extension of counting partitioning that extends to multiplication, division, and fractions", "(Source: EM2 G2 M6 Why)", "Additional Notes:", "Decomposes or partitions to-be-estimated set into convenient subset sizes then recomposes the numerosity. Initially, this is done with regular arrangements using repeated addition or multiplication. Later, the process can be done with irregular arrangements and children more consistently use multiplication skills to recompose (Source: Learning Trajectories: Composition Estimator)", "Launch ideas:", "EM2 G2 M1 TI L37", "Lesson ideas:", "EM2 G1 M1 TD L25", "EM2 G2 M1 TE L23", "EM2 G2 M4 TA L1", "EM2 G2 M4 TE L24", "Instructional days:", "Likely 1-2 days instructional days"], "considerations": ["How did you group the set? Show a lower estimate, a higher estimate, and defend your best.”", "Possible measurement to include: length, area, volume, time, perimeter, angles", "Variables: Arrays, quasi-arrays, irregular clusters; visibility of grouping cues"], "intervention_notes": ["Notes for Intervention:", "Encourage students to physically or mentally draw boundaries around subsets.", "The use of ten-frames and 10-frame cartons support one-to-one correspondence (Source: EM2 GK M1 TB L6 & L17)", "Use dot collections, cubes, or counters arranged in loose clusters. Ask questions such as:", "What smaller groups do you notice?", "Which part is easiest to estimate first?", "About how many are in each group?", "Allow students to explain multiple growing strategies for the same collection.", "Progress from structural arrangements (rows, arrays, clusters) to irregular scattered collections.", "Students may choose to use organizing tools as they count and record. Cups, bowls, and number paths can support or challenge students. (Source: EM2 PreK M1 Counting Collections)", "Number paths of different lengths are excellent tools to offer. Number paths support one-to-one correspondence and may allow students to stretch into larger collections than they could count alone. Student also use number paths as a way to independently find and copy numerals. (Source: EM2 GK M1 TG L33)", "Notes for Extension:", "Students who are proficient can deepen their reasoning by:", "Comparing multiple partitioning strategies for the same collection.", "“I saw four groups of six.”", "“I saw two groups of twelve.”", "“I saw ten and about fourteen more.” (EM2 G1 M6 TD L16 Differentiation: Challenge)", "Estimate larger collections (50–200 objects)", "Use benchmark quantities (5, 10, 25, 50, 100)", "Explain which partitioning strategy produces the most reasonable estimate", "Connect partitioning to:", "Repeated addition", "Skip counting", "Arrays", "Area models", "Multiplication", "Estimate before verifying by counting", "Optional Activities:", "Estimating Game (Learning Trajectories website- Composition Estimator Estimating Game)"], "mathematical_models": ["Number line"], "product_reference": ["EM2 G1 M3 TD L15", "EM2 G2 M1 TE L23, TI L37", "EM2 G2 M4 TE L1 & L24", "EM2 G2 M5 TE L1", "EM2 G2 M6 TA L2"], "required_skills_cases": ["Equal-size partitioning", "The set can be mentally grouped into approximately equal subsets. Example: “This looks like about 4 groups of 5, so about 20.”", "Unequal-size partitioning", "The set is broken into non-equal but meaningful chunks.", "Example: “There are about 10 on this side and about 6 on that side, so about 16.”", "Array or structured arrangement", "Objects are arranged in rows, columns, clusters, or repeated groups that support partitioning. Example: “About 3 rows of 6, so about 18.”", "Unstructured collection", "Objects are scattered, requiring the student to impose their own grouping strategy.", "Recomposition with approximation", "Student combines estimated subset quantities and understands the result is approximate, not exact."], "specifications": ["The total set should contain too many objects for immediate subitizing, but not so many that partitioning becomes inaccessible.", "Subsets should be visually or conceptually available through spacing, clustering, rows, columns, color, shape, or student-imposing grouping.", "The task should ask for an estimate, about how many, or a reasonable total, not an exact count.", "Student should not need to count every object one by one.", "The skill should involve both:", "Decomposition: breaking the whole into parts", "Recomposition: combining the approximate parts into a total", "Acceptable reasoning may include additive, skip-counting, or early multiplicative thinking."], "standards_notes": ["2.OA.C.4", "2.OA.C.3", "2.OA.B.2", "CA.2.OA.4", "CA.2.OA.3", "CA.2.NBT.2", "TX.2.6A", "TX.2.2A", "TX.2.4B", "FL.2.AR.3.2", "FL.2.AR.3.1", "FL.2.NSO.1.4"], "strategies": ["Repeated addition", "Multiplication", "Include measurement along with counting here, and throughout the rest of the stem.", "Choose a unit, iterate, and anchor to measurement benchmarks (about a foot, about a liter).", "Prompts mirror bounds/justification with counting."]}}, "WHO:2dbecb7d70787f5f": {"source_key": "WHO:2dbecb7d70787f5f", "node_id": "WHO-0001", "node_text": "Identify place value units and understand that each one is composed of ten of the next smaller unit.", "stem_id": "WHO", "stem_name": "Whole Numbers and Base Ten Structure", "cs_label_display": "Use place value to read and write numbers.", "goal": "Understand what each digit in a number represents", "grades": ["K", "1", "2", "3", "4", "5"], "state": "span", "in_grade": true, "grade_raw": "K-5", "period_hint_text": "G2: Likely 2 instructional periods", "ccss": ["1.NBT.B.2", "1.NBT.B.2.a", "1.NBT.B.2.b", "1.NBT.B.2.c", "2.NBT.A.1", "2.NBT.A.1.a", "2.NBT.A.1.b", "K.NBT.A.1"], "lessons": ["G1-M3-L16", "G4-M1-L5", "G4-M5-L1", "G4-M5-L2", "G4-M5-L3", "G5-M1-L1", "G5-M4-L1", "G5-M4-L2", "GK-M6-L1"], "state_codes": ["AR.3.NPV.2", "MD.K.NOS.C.9.b", "MN.3.3.5.2", "NY.3.NBT.4a", "OK.3.N.1.2", "VA.3.NS.1.b"], "fields": {"additional_notes": ["Additional Notes", "Incorporate use of concrete materials/bundling to build conceptual understanding when introducing new PV units", "GK: Part of an instructional period", "G1: Likely 3 instructional periods", "G2: Likely 2 instructional periods", "G3: Likely 1 instructional period", "G4: Likely 2 instructional periods (1 whole numbers, 1 decimals)", "G5: Likely 2 instructional periods (1 whole numbers, 1 decimals)"], "intervention_notes": ["Intervention", "Math Catalyst, Compose, Decompose, and Represent Numbers to 100,000, Concept Mini Lesson 1", "Math Catalyst, Compose, Decompose, and Represent Multi-Digit Numbers, Concept Mini Lesson 1", "Math Catalyst, Compose, Decompose, and Represent Decimals to Hundredths, Concept Mini Lesson 1", "Math Catalyst, Compose, Decompose, and Represent Decimals to Thousandths, Concept Mini Lesson 1", "Extension", "Math Catalyst, Compose, Decompose, and Represent Decimals to Hundredths, Application, Solve a Problem", "Math Catalyst, Compose, Decompose, and Represent Decimals to Thousandths, Application, Solve a Problem"], "mathematical_models": ["Wu’s “counting array”", "Number line (decimals)"], "misconceptions": ["From TX BB G2 M3 MO:", "Students may think that 10 of a given unit should be exchanged for 10 of the next larger unit, rather than 1 of the next larger unit. (e.g., “10 tens equal 10 hundreds”)."], "product_reference": ["EM2 GK M6 TA L1: Describe teen numbers as 10 ones and ___ ones.", "GK Strawman Lesson 2: Count out a group and represent it as tens and ones.", "EM2 G1 M3 TD L16: Identify ten as a unit.", "EM2 G1 M5 TA: Grouping Units in Tens and Ones", "EM2 G2 M5 TE: Understand Place Value Units", "EM2 FL G3 M2 TB (or MD G3 M2 TA-1)", "EM2 G4 M1 L5, L6 (multiplicative reasoning*)", "EM2 G4 M5 L1-3, 5-6", "EM2 G5 M1 L1 (multiplicative reasoning*)", "EM2 G5 M4 L1-2 (L4 multiplicative reasoning*)", "*multiplicative reasoning (10 times as much) has its own row in this ladder"], "required_skills_cases": ["Ones to 19 (ten ones and some more ones) (GK)", "Ones, tens (GK or G1)", "Ones, tens, hundreds (G2)", "Ones to thousands and 10,000s (G3)", "Millions to hundredths (G4)", "Billions to hundredths (G5)"], "specifications": ["For Whole Numbers:", "Concept of “ones” (GK)", "10 ones = 1 ten (GK or G1)", "10 tens = 1 hundred (G2)", "10 hundreds = 1 thousand", "10 thousands = 1 ten thousand", "10 ten thousands = 1 hundred thousand", "10 hundred thousands = 1 million", "For Decimal Numbers:", "Begin by decomposing 1 into 10 tenths to establish tenths as a place value unit", "1 one = 10 tenths", "1 tenth = 10 hundredths", "1 hundredth = 10 thousandths"], "standards_notes": ["K-2", "K.NBT.A.1", "1.NBT.B.2", "1.NBT.B.2.a", "1.NBT.B.2.b", "1.NBT.B.2.c", "2.NBT.A.1", "2.NBT.A.1.a", "2.NBT.A.1.b", "MD.K.NOS.C.9.b", "3-5", "AR.3.NPV.2", "MN.3.3.5.2", "NY.3.NBT.4a", "OK.3.N.1.2", "VA.3.NS.1.b"], "terminology": ["Place value is a way of writing down numbers that lets us write down any whole number using only ten different symbols.", "A place value unit is a unit in the base-ten system corresponding to a power of 10. A digit in a place tells how many of that unit are represented. For whole numbers, the place value units are:", "ones, tens, hundreds, thousands, ten-thousands, ... (for lower grades, fine to just name the units, no need to get into the power of ten stuff until they have powers of 10 in G5)"]}}, "WHO:e76a48efd939b02c": {"source_key": "WHO:e76a48efd939b02c", "node_id": "WHO-0002", "node_text": "Determine the value represented by each digit of a number.", "stem_id": "WHO", "stem_name": "Whole Numbers and Base Ten Structure", "cs_label_display": "Use place value to read and write numbers.", "goal": "Understand what each digit in a number represents", "grades": ["K", "1", "2", "3", "4", "5"], "state": "span", "in_grade": true, "grade_raw": "K-5", "period_hint_text": "G2: Likely 2 instructional periods", "ccss": ["1.NBT.B.2", "1.NBT.B.2.b", "1.NBT.B.2.c", "2.NBT.A.1", "2.NBT.A.1.b", "K.NBT.A.1"], "lessons": ["G1-M3-L16", "G4-M1-L7", "G4-M5-L36", "G5-M4-L2", "G5-M4-L3", "GK-M6-L1"], "state_codes": ["AR.3.NPV.2", "MD.K.NOS.C.9.b", "NY.3.NBT.4a", "TX.4.2B", "TX.5.2A", "VA.3.NS.1.b"], "fields": {"additional_notes": ["GK: Likely 5 instructional periods, with additional practice time needed", "G1: Likely 3 instructional periods", "G2: Likely 2 instructional periods", "G3: Likely 1 instructional period", "G4: Likely 2 instructional periods (1 whole numbers, 1 decimals)", "G5: Likely 2 instructional periods (1 whole numbers, 1 decimals)"], "considerations": ["Re: this row and the next. This row is about understanding that the position of a digit determines where the whole number lives in the counting sequence (or the location of a decimal on a number line). The next row is about being able to write that understanding in an incredibly mathematically useful canonical notation.", "Building the counting array demonstrates the genius of a place value system:", "It allows us to describe all whole numbers using only ten symbols", "As the array gets large, can introduce ellipses", "Aspire activities:", "Contrast with roman numerals", "Students can invent their own symbols and build their own arrays", "Support counting array with concrete objects", "For decimals:", "use the number line; the counting array is for whole number place value", "relate decimal fractions to decimal numbers (fraction and decimal equivalence)"], "intervention_notes": ["Intervention", "From TX BB G1 M4 MO: Use place value cards to represent a number. Pull the cards apart to show the value of each digit separately. Push them back together to unify the values as one number.", "Math Catalyst, Compose, Decompose, and Represent Numbers to 100,000, Concept Mini Lessons 1, 2, and 4", "Math Catalyst, Compose, Decompose, and Represent Multi-Digit Numbers, Concept Mini Lesson 2", "Math Catalyst, Compose, Decompose, and Represent Decimals to Hundredths, Concept Mini Lesson 2", "Math Catalyst, Compose, Decompose, and Represent Decimals to Thousandths, Concept Mini Lesson 2", "Extension", "EM2 G4 M1 Math Past", "EM2 G4 M5 Math Past", "Math Catalyst, Compose, Decompose, and Represent Numbers to 100,000, Application Solve a Task", "Math Catalyst, Compose, Decompose, and Represent Multi-Digit Numbers, Application Solve a Task", "Math Catalyst, Compose, Decompose, and Represent Decimals to Hundredths, Application, Solve a Task", "Math Catalyst, Compose, Decompose, and Represent Decimals to Thousandths, Application, Solve a Task"], "mathematical_models": ["Wu’s “counting array”", "Number line (decimals)"], "misconceptions": ["From TX BB G1 M4 MO: Students think the digit in a number and the value of that digit is always the same (e.g., “24 is 2 and 4”)."], "product_reference": ["EM2 GK M6 TA L1: Describe teen numbers as 10 ones and ___ ones.", "GK Strawman Lesson 2: Co
