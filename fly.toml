# See docs/HOSTING.md. Deployed via GitHub Actions (.github/workflows/), not
# a local `fly launch` -- John's machine can't run flyctl (corporate network
# blocks the install script). The app name below is real, not a placeholder:
# it must match .github/workflows/fly-setup.yml and fly-deploy.yml exactly,
# since those hardcode it rather than reading it back out of this file for
# the `apps create` / `volumes create` steps. Change it in all three places
# together, or not at all.

app = "greatminds-mh2-gap-auditor"
primary_region = "iad"        # Ashburn, VA -- reasonable US default; change in all three files together if writers are elsewhere

[build]

[env]
  PORT = "8080"

# Persistent disk for data/build: mh2.db (rebuilt every start, fine to lose)
# and mh2_seq.db (durable writer judgments, must never be lost). Create
# with: fly volumes create mh2_data --size 1 --region <primary_region>
[[mounts]]
  source = "mh2_data"
  destination = "/app/data/build"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # keep the one machine running -- writers,
  auto_start_machines = true   # not bursty traffic; avoid cold-start auth confusion
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
