# Updates the MH2_AUTH_USERS secret on the already-created Fly app -- for
# adding/removing/rotating a writer's credentials later. Safe to re-run any
# number of times, unlike fly-setup.yml (whose volume-creation step is not
# safe to repeat). Requires fly-setup.yml to have already run once.

name: Fly update writer credentials

on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: greatminds-mh2-gap-auditor
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl secrets set MH2_AUTH_USERS="${{ secrets.MH2_AUTH_USERS }}" --app "$FLY_APP"
